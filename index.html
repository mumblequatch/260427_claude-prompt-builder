<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Claude Prompt Builder</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    font-size: 13px;
    margin: 0;
    padding: 14px 16px;
    background: #1e1e1e;
    color: #e8e8e8;
    width: 760px;
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  h1 {
    font-size: 12px;
    margin: 0;
    color: #8ab4f8;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .field {
    margin-bottom: 9px;
  }
  label.field-label {
    display: block;
    font-weight: 600;
    margin-bottom: 3px;
    color: #c8c8c8;
    font-size: 11px;
    letter-spacing: 0.3px;
    text-transform: uppercase;
  }
  textarea {
    width: 100%;
    background: #2a2a2a;
    color: #e8e8e8;
    border: 1px solid #3a3a3a;
    border-radius: 4px;
    padding: 7px 9px;
    font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    font-size: 13px;
    resize: vertical;
    line-height: 1.4;
  }
  textarea:focus {
    outline: none;
    border-color: #8ab4f8;
    background: #2d2d2d;
  }
  textarea::placeholder {
    color: #6a6a6a;
    font-style: italic;
  }
  .small textarea { min-height: 36px; }
  .medium textarea { min-height: 54px; }
  .large textarea { min-height: 76px; }
  .file-row {
    display: flex;
    gap: 6px;
    margin-top: 4px;
    align-items: center;
  }
  .file-row button {
    background: #2a2a2a;
    color: #aaa;
    border: 1px solid #3a3a3a;
    padding: 4px 10px;
    font-size: 11px;
    border-radius: 3px;
    cursor: pointer;
  }
  .file-row button:hover {
    background: #353535;
    color: #e8e8e8;
  }
  .file-status {
    font-size: 11px;
    color: #888;
    flex: 1;
  }
  input[type="file"] { display: none; }
  .row {
    display: flex;
    gap: 8px;
    margin-top: 14px;
    align-items: center;
  }
  button.action {
    background: #2a2a2a;
    color: #e8e8e8;
    border: 1px solid #3a3a3a;
    border-radius: 4px;
    padding: 7px 14px;
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
  }
  button.action:hover {
    background: #353535;
    border-color: #4a4a4a;
  }
  button.primary {
    background: #1a73e8;
    border-color: #1a73e8;
    color: white;
    font-weight: 600;
  }
  button.primary:hover {
    background: #1765cc;
    border-color: #1765cc;
  }
  .spacer { flex: 1; }
  .hint {
    font-size: 11px;
    color: #888;
  }
  kbd {
    background: #3a3a3a;
    padding: 1px 5px;
    border-radius: 3px;
    font-family: -apple-system, monospace;
    font-size: 10px;
    color: #ccc;
  }
  select {
    width: 100%;
    background: #2a2a2a;
    color: #e8e8e8;
    border: 1px solid #3a3a3a;
    border-radius: 4px;
    padding: 6px 9px;
    font-family: inherit;
    font-size: 13px;
  }
  select:focus { outline: none; border-color: #8ab4f8; }
</style>
</head>
<body data-kmwindow="792,680">

<div class="header">
  <h1>Claude Prompt Builder</h1>
</div>

<div class="field small">
  <label class="field-label" for="role">Context</label>
  <textarea id="role" rows="2"
    placeholder="e.g., 'You are helping me think through X' or 'Act as a skeptical reviewer'. Optional — Claude infers from task if blank."></textarea>
</div>

<div class="field large">
  <label class="field-label" for="background">Background</label>
  <textarea id="background" rows="4"
    placeholder="Context, prior decisions, relevant files. Files attached below will be appended automatically. Don't repeat what's in your memory."></textarea>
  <div class="file-row">
    <button type="button" onclick="document.getElementById('filePicker').click()">+ Add files</button>
    <button type="button" onclick="clearFiles()" id="clearFilesBtn" style="display:none">Clear files</button>
    <span class="file-status" id="fileStatus">No files attached</span>
    <input type="file" id="filePicker" multiple onchange="handleFiles(event)">
  </div>
</div>

<div class="field medium">
  <label class="field-label" for="task">Specific Task</label>
  <textarea id="task" rows="3"
    placeholder="What you want done, in one or two sentences. The 'verb' of the prompt."></textarea>
</div>

<div class="field medium">
  <label class="field-label" for="rules">Rules / Constraints</label>
  <textarea id="rules" rows="3"
    placeholder="Ad-hoc rules for this prompt only. Standing directives (SEARCH-FIRST, BUYER-FIRST, DEPTH-FIRST, OPTIONS-FIRST, VERIFY-PROCEDURES, DO-THE-WORK) apply automatically from memory — invoke explicitly here only to emphasize."></textarea>
</div>

<div class="field small">
  <label class="field-label" for="success">Success Criteria</label>
  <textarea id="success" rows="2"
    placeholder="How will I know this is right? e.g., 'A ranked list with reasoning', 'Working code I can paste into Reaper', 'A go/no-go recommendation'."></textarea>
</div>

<div class="field small">
  <label class="field-label" for="format">Output Format</label>
  <textarea id="format" rows="2"
    placeholder="e.g., 'Markdown with code blocks', 'Bullet list under 200 words', 'Full file reoutput per directive', 'Bare triple backticks for fences'."></textarea>
</div>

<div class="field small" id="historyField" style="display:none">
  <label class="field-label" for="historySelect">History</label>
  <select id="historySelect" onchange="recallSelected()"></select>
</div>

<div class="row">
  <button type="button" class="action" onclick="clearAll()">Clear</button>
  <button type="button" class="action" onclick="recallLast()" title="Load the most recent prompt (click again to step further back)">Recall last</button>
  <span class="spacer"></span>
  <span class="hint"><kbd>⌘↵</kbd> assemble · <kbd>⌃R</kbd> recall · <kbd>Esc</kbd> cancel</span>
  <button type="button" class="action primary" onclick="assemble()">Assemble &amp; Copy</button>
</div>

<input type="hidden" name="PB_Assembled" id="pbAssembled">

<script>
// File handling
let attachedFiles = []; // [{path, name, kind, contents}]

const TEXT_EXTS = new Set([
  'txt','md','mdx','markdown','rst','tex',
  'py','js','jsx','ts','tsx','sh','bash','zsh','rb','go','rs','c','cpp','h','hpp','swift','m','mm',
  'lua','eel','rpp','rfxchain','jsfx','jsfx-inc',
  'applescript','scpt',
  'html','htm','css','scss','sass','xml','svg','vue',
  'json','yaml','yml','toml','ini','conf','cfg','env','plist',
  'srt','vtt','ass',
  'tw','twee',
  'csv','tsv','log',
  'sql','graphql'
]);

const DOCX_EXTS = new Set(['docx','doc','rtf','rtfd','odt']);
const PDF_EXTS = new Set(['pdf']);
const BINARY_EXTS = new Set([
  'wav','aif','aiff','mp3','m4a','flac','ogg','opus',
  'mp4','mov','mkv','avi','webm',
  'png','jpg','jpeg','gif','heic','webp','tiff','bmp',
  'pptx','xlsx','key','pages','numbers',
  'zip','tar','gz','dmg','7z','rar'
]);

function getExt(name) {
  const i = name.lastIndexOf('.');
  return i >= 0 ? name.slice(i+1).toLowerCase() : '';
}

function classify(name) {
  const ext = getExt(name);
  if (TEXT_EXTS.has(ext)) return 'text';
  if (DOCX_EXTS.has(ext)) return 'docx-like';
  if (PDF_EXTS.has(ext)) return 'pdf';
  if (BINARY_EXTS.has(ext)) return 'binary';
  return 'unknown';
}

function handleFiles(event) {
  const files = Array.from(event.target.files);
  for (const f of files) {
    // WebKit gives us the path via webkitRelativePath sometimes, but for file input
    // the secure path may be in f.path (Electron) or absent (pure web).
    // KM's WebKit context typically exposes the file but not always the path.
    // We'll capture name + size + classification; path resolution happens at assembly.
    const kind = classify(f.name);
    attachedFiles.push({
      name: f.name,
      size: f.size,
      kind: kind,
      // path will be filled in by KM-side helper if needed; for now we hold the File object
      _file: f
    });
  }
  updateFileStatus();
  event.target.value = ''; // allow re-picking same file
}

function clearFiles() {
  attachedFiles = [];
  updateFileStatus();
}

function updateFileStatus() {
  const status = document.getElementById('fileStatus');
  const clearBtn = document.getElementById('clearFilesBtn');
  if (attachedFiles.length === 0) {
    status.textContent = 'No files attached';
    clearBtn.style.display = 'none';
  } else {
    const summary = attachedFiles.map(f => f.name).join(', ');
    status.textContent = `${attachedFiles.length} file(s): ${summary}`;
    clearBtn.style.display = '';
  }
}

// Read text file contents (browser File API)
function readTextFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => resolve(e.target.result);
    reader.onerror = e => reject(e);
    reader.readAsText(file);
  });
}

// Format file block based on kind
async function formatFileBlock(f) {
  const TEXT_LIMIT = 100 * 1024; // 100KB

  if (f.kind === 'text') {
    if (f.size <= TEXT_LIMIT) {
      try {
        const contents = await readTextFile(f._file);
        return `<file name="${f.name}">\n\`\`\`\n${contents}\n\`\`\`\n</file>`;
      } catch (e) {
        return `<file name="${f.name}" note="failed to read: ${e.message}" />`;
      }
    } else {
      // Large text: include first 50 lines + note
      try {
        const contents = await readTextFile(f._file);
        const lines = contents.split('\n');
        const sample = lines.slice(0, 50).join('\n');
        return `<file name="${f.name}" size="${(f.size/1024).toFixed(1)}KB" note="large file, first 50 lines shown">\n\`\`\`\n${sample}\n... [truncated, ${lines.length - 50} more lines]\n\`\`\`\n</file>`;
      } catch (e) {
        return `<file name="${f.name}" note="failed to read: ${e.message}" />`;
      }
    }
  }

  if (f.kind === 'docx-like') {
    return `<file name="${f.name}" note="Word/RTF document — extract via 'textutil -convert txt -stdout' if needed, or attach via paperclip." />`;
  }

  if (f.kind === 'pdf') {
    return `<file name="${f.name}" note="PDF — attach via paperclip if Claude.ai, or reference path if Claude Code." />`;
  }

  if (f.kind === 'binary') {
    return `<file name="${f.name}" note="Binary file — attach via paperclip if Claude.ai, or reference path if Claude Code." />`;
  }

  // unknown
  return `<file name="${f.name}" note="Unknown format — attach via paperclip if Claude.ai, or reference path if Claude Code." />`;
}

// ---- History (localStorage; persists across KM window opens) ----
const HISTORY_KEY = 'pb_history_v1';
const HISTORY_CAP = 25;
const FIELD_IDS = ['role','background','task','rules','success','format'];
let _recallIdx = -1;

function loadHistory() {
  try {
    const arr = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
    return Array.isArray(arr) ? arr : [];
  } catch (e) { return []; }
}

function saveToHistory(entry) {
  try {
    const h = loadHistory();
    if (!h.length || h[0].assembled !== entry.assembled) h.unshift(entry);
    localStorage.setItem(HISTORY_KEY, JSON.stringify(h.slice(0, HISTORY_CAP)));
  } catch (e) { /* quota or blocked storage — ignore */ }
  _recallIdx = -1;
  populateHistorySelect();
}

function applyEntry(e) {
  FIELD_IDS.forEach(id => { document.getElementById(id).value = e[id] || ''; });
  if (typeof autosizeTextareas === 'function') autosizeTextareas();
}

function entryLabel(e, i) {
  let t = '';
  try {
    t = new Date(e.ts).toLocaleString([], {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'});
  } catch (_) {}
  const snip = (e.task || e.role || e.background || '').replace(/\s+/g,' ').trim().slice(0,48);
  return (i + 1) + '. ' + t + (snip ? ' \u2014 ' + snip : '');
}

function populateHistorySelect() {
  const sel = document.getElementById('historySelect');
  const field = document.getElementById('historyField');
  if (!sel || !field) return;
  const h = loadHistory();
  sel.innerHTML = '';
  const def = document.createElement('option');
  def.value = '';
  def.textContent = h.length ? 'Recall a prompt\u2026' : 'No history yet';
  sel.appendChild(def);
  h.forEach((e, i) => {
    const o = document.createElement('option');
    o.value = String(i);
    o.textContent = entryLabel(e, i);
    sel.appendChild(o);
  });
  field.style.display = h.length ? '' : 'none';
}

function recallSelected() {
  const sel = document.getElementById('historySelect');
  const idx = parseInt(sel.value, 10);
  if (isNaN(idx)) return;
  const h = loadHistory();
  if (!h[idx]) return;
  _recallIdx = idx;
  applyEntry(h[idx]);
  const fileNote = (h[idx].files && h[idx].files.length) ? ' \u00b7 files were: ' + h[idx].files.join(', ') : '';
  flashStatus('Recalled ' + (idx + 1) + '/' + h.length + fileNote);
}

// Quick recall: newest first, stepping further back on repeated calls.
function recallLast() {
  const h = loadHistory();
  if (!h.length) { flashStatus('No history yet'); return; }
  _recallIdx = (_recallIdx + 1) % h.length;
  applyEntry(h[_recallIdx]);
  const sel = document.getElementById('historySelect');
  if (sel) sel.value = String(_recallIdx);
  const fileNote = (h[_recallIdx].files && h[_recallIdx].files.length) ? ' \u00b7 files were: ' + h[_recallIdx].files.join(', ') : '';
  flashStatus('Recalled ' + (_recallIdx + 1) + '/' + h.length + fileNote);
}

// Assemble the prompt
async function assemble() {
  const role = document.getElementById('role').value.trim();
  const background = document.getElementById('background').value.trim();
  const task = document.getElementById('task').value.trim();
  const rules = document.getElementById('rules').value.trim();
  const success = document.getElementById('success').value.trim();
  const format = document.getElementById('format').value.trim();

  // Build file blocks
  let fileBlocks = '';
  if (attachedFiles.length > 0) {
    const blocks = await Promise.all(attachedFiles.map(f => formatFileBlock(f)));
    fileBlocks = blocks.join('\n');
  }

  // Assemble sections (only include non-empty ones)
  const sections = [];

  if (role) sections.push(`<context>\n${role}\n</context>`);

  if (background || fileBlocks) {
    let bgContent = background;
    if (fileBlocks) {
      bgContent = bgContent ? `${bgContent}\n\n${fileBlocks}` : fileBlocks;
    }
    sections.push(`<background>\n${bgContent}\n</background>`);
  }

  if (rules) sections.push(`<rules>\n${rules}\n</rules>`);

  if (task) sections.push(`<task>\n${task}\n</task>`);

  if (success) sections.push(`<success_criteria>\n${success}\n</success_criteria>`);

  if (format) sections.push(`<output_format>\n${format}\n</output_format>`);

  const assembled = sections.join('\n\n');

  saveToHistory({
    ts: new Date().toISOString(),
    role, background, task, rules, success, format,
    files: attachedFiles.map(f => f.name),
    assembled
  });

  // Write directly to clipboard from JS — sidesteps KM's variable-sync timing.
  // Mirror to PB_Assembled as a fallback in case clipboard write is blocked.
  const finish = () => {
    if (window.KeyboardMaestro) {
      window.KeyboardMaestro.Submit('OK');
    } else {
      alert('Copied to clipboard:\n\n' + assembled.slice(0, 500) + (assembled.length > 500 ? '\n\n[truncated in preview]' : ''));
    }
  };

  const el = document.getElementById('pbAssembled');
  if (el) {
    el.value = assembled;
    el.defaultValue = assembled;
    el.setAttribute('value', assembled);
  }

  navigator.clipboard.writeText(assembled).then(finish).catch(() => {
    // Clipboard API blocked; rely on KM variable path. Submit anyway.
    finish();
  });
}

function clearAll() {
  document.getElementById('role').value = '';
  document.getElementById('background').value = '';
  document.getElementById('task').value = '';
  document.getElementById('rules').value = '';
  document.getElementById('success').value = '';
  document.getElementById('format').value = '';
  clearFiles();
  _recallIdx = -1;
  // Visual feedback
  flashStatus('Cleared');
}

function flashStatus(msg) {
  const status = document.getElementById('fileStatus');
  status.textContent = msg;
  status.style.color = '#8ab4f8';
  setTimeout(() => {
    status.style.color = '#888';
    updateFileStatus();
  }, 1500);
}

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (window.KeyboardMaestro) {
      window.KeyboardMaestro.Cancel('Cancel');
    }
  } else if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
    e.preventDefault();
    assemble();
  } else if (e.ctrlKey && !e.metaKey && (e.key === 'r' || e.key === 'R')) {
    e.preventDefault();
    recallLast();
  }
});

// KM lifecycle hooks
function KMInit() {
  // Auto-load draft if KM passes a flag (optional)
  // Otherwise leave fields blank
}

function KMWillShowWindow() {
  // Focus the task field by default — that's the most-edited field
  setTimeout(() => document.getElementById('role').focus(), 50);
  populateHistorySelect();
  relayout();
}

// Grow each textarea to fit its content, then size the window to fit everything
// so there's no window scrollbar. CSS min-heights keep empty fields from collapsing.
function autosizeTextareas() {
  document.querySelectorAll('textarea').forEach(t => {
    t.style.height = 'auto';
    t.style.height = (t.scrollHeight + 2) + 'px';
  });
  fitWindow();
}

function fitWindow() {
  // KM ignores window.resizeTo in custom prompts; it resizes the window to match
  // the body's data-kmwindow attribute, which it polls. So mutate that instead.
  try {
    const avail = ((window.screen && window.screen.availHeight) || 1000) - 60;
    const h = Math.min(Math.ceil(document.body.scrollHeight) + 6, avail);
    document.body.setAttribute('data-kmwindow', '792,' + h);
  } catch (e) {}
}

function relayout() { autosizeTextareas(); }

document.querySelectorAll('textarea').forEach(t => t.addEventListener('input', relayout));

// Re-fit the window whenever the body's size changes for any reason —
// manual textarea drag-resize (no 'input' event), history field toggling, etc.
if (typeof ResizeObserver !== 'undefined') {
  let _rafFit = null;
  const ro = new ResizeObserver(() => {
    if (_rafFit) cancelAnimationFrame(_rafFit);
    _rafFit = requestAnimationFrame(fitWindow);
  });
  ro.observe(document.body);
}

window.addEventListener('DOMContentLoaded', () => {
  populateHistorySelect();
  relayout();
});
</script>

</body>
</html>
